# Default: SQLite in a named volume.
#   docker compose up -d
#
# With PostgreSQL instead:
#   docker compose --profile postgres up -d
#   (and set KOSH_DB_DRIVER=postgres + KOSH_DB_DSN below, or in a .env file)

services:
  kosh:
    build:
      context: .
      args:
        VERSION: ${KOSH_VERSION:-dev}
    image: kosh:${KOSH_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${KOSH_PORT:-8080}:8080"
    environment:
      KOSH_DB_DRIVER: ${KOSH_DB_DRIVER:-sqlite}
      KOSH_DB_DSN: ${KOSH_DB_DSN:-}
      KOSH_ALLOW_SIGNUP: ${KOSH_ALLOW_SIGNUP:-false}
      KOSH_CORS_ORIGINS: ${KOSH_CORS_ORIGINS:-}
      KOSH_BACKUP_INTERVAL: ${KOSH_BACKUP_INTERVAL:-24h}
      KOSH_BACKUP_KEEP: ${KOSH_BACKUP_KEEP:-14}
      KOSH_TRUST_PROXY: ${KOSH_TRUST_PROXY:-false}
    volumes:
      - kosh-data:/data
      # Put backups on a different disk or a synced folder (3-2-1 rule):
      # - /mnt/backup/kosh:/data/backups
    read_only: true
    tmpfs: [/tmp]          # SQLite temp files
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  postgres:
    profiles: [postgres]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kosh
    volumes:
      - kosh-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosh"]
      interval: 10s
      retries: 5

volumes:
  kosh-data:
  kosh-pg:
