<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <!-- LekhaMint draws its own light and dark themes. Saying so stops browsers that force a dark mode on
         sites (Chrome's "dark theme for websites", Samsung Internet, Edge) from recolouring the page,
         which turned hovered text and highlights dark on dark. -->
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="description" content="LekhaMint: a local-first money manager for expenses, budgets and accounts." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>LekhaMint</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
