name: Demo site

# Publishes the online demo to GitHub Pages: the web app plus the real server compiled
# to WebAssembly, seeded with a sample household. Everything runs in the visitor's browser.

on:
  push:
    branches: [main]
    paths: ["web/**", "server/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: Build the demo
        working-directory: server
        run: make demo-site VERSION="$(git describe --tags --always)"
      - name: Add the install scripts
        run: cp install.sh install.ps1 web/dist-demo/
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist-demo }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
