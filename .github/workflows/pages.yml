name: Demo site

# Publishes the online demo to GitHub Pages: the web app plus the real server compiled
# to WebAssembly, seeded with a sample household. Everything runs in the visitor's browser.

on:
  push:
    branches: [main]
    paths: ["web/**", "server/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: Build the demo
        working-directory: server
        run: make demo-site VERSION="$(git describe --tags --always)"
      - name: Add the install scripts
        run: cp install.sh install.ps1 web/dist-demo/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: web/dist-demo }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
