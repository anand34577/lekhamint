name: Publish wiki

# docs/wiki is the source of truth; the GitHub wiki is a generated copy.
# The wiki must already exist (create its first page once in the web UI).

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**", "scripts/sync-wiki.sh", ".github/workflows/wiki.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
      - name: Sync pages
        run: sh scripts/sync-wiki.sh wiki
      - name: Commit and push
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "wiki already up to date"; exit 0; fi
          git commit -m "Sync wiki from docs/wiki@${GITHUB_SHA::7}"
          git push
