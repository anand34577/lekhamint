name: CI

# Runs on pull requests only: a merge to main has already passed here, and
# tagged releases run their own tests and builds (release.yml).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Server (SQLite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: GOOS=js GOARCH=wasm go vet ./cmd/lekhamint-wasm ./internal/db
      - run: go test ./... -count=1
      - name: Cross-compile every release target
        run: make release VERSION=ci
      - name: Build the in-browser demo server
        run: GOOS=js GOARCH=wasm go build -o /tmp/lekhamint.wasm ./cmd/lekhamint-wasm

  server-postgres:
    name: Server (PostgreSQL 17)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: lekhamint, POSTGRES_PASSWORD: lekhamint, POSTGRES_DB: lekhamint_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U lekhamint" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEKHAMINT_TEST_PG_DSN: postgres://lekhamint:lekhamint@localhost:5432/lekhamint_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - run: go test ./... -count=1

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:demo

  android:
    name: Android (unit tests, release build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # The receipt reader is native code (ncnn): the build needs this NDK and CMake.
      - name: Install the NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      # Signed with the real key when the secrets are available (pushes, PRs from this repo);
      # otherwise the release build falls back to the debug key.
      - name: Decode release keystore
        env: { KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Test, lint and build the release APK and Play bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDirectDebugUnitTest lintDirectRelease lintPlayRelease assembleDirectRelease bundlePlayRelease -PallowDebugSigning=true --console=plain

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: lekhamint:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and check health, sign-up and the web app
        run: |
          docker run -d --name lm -p 8080:8080 --read-only --tmpfs /tmp lekhamint:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/v1/meta
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
          curl -fsS -X POST localhost:8080/api/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1","name":"CI"}' | grep -q token
          docker logs lm

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: shellcheck -s sh install.sh scripts/*.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs; exit 1 }
      - name: Validate compose files
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-check/' .env
          docker compose -f docker-compose.yml config -q
          docker compose --env-file .env -f deploy/docker-compose.postgres.yml config -q
          docker compose --env-file .env -f deploy/docker-compose.caddy.yml config -q

  install-linux:
    name: One-line install on Linux (systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: Serve a local release and the repository files
        run: |
          mkdir -p /tmp/rel
          (cd server && CGO_ENABLED=0 go build -ldflags "-X main.version=ci" -o /tmp/rel/lekhamint-linux-amd64 ./cmd/lekhamint)
          (cd /tmp/rel && sha256sum * > SHA256SUMS.txt)
          nohup python3 -m http.server 8777 --directory /tmp/rel > /dev/null 2>&1 &
          sleep 1
      - name: Install, upgrade, uninstall
        env:
          LEKHAMINT_DOWNLOAD_BASE: http://127.0.0.1:8777
        run: |
          sh install.sh --yes --port 8085
          curl -fsS localhost:8085/healthz
          systemctl is-active lekhamint
          sh install.sh --yes                       # upgrade keeps the port from the settings file
          curl -fsS localhost:8085/healthz
          sudo grep -q 'LEKHAMINT_ADDR=:8085' /etc/lekhamint/lekhamint.env
          sh install.sh --uninstall
          if systemctl is-active --quiet lekhamint; then echo 'still running'; exit 1; fi
          sudo test -d /var/lib/lekhamint           # data is kept
