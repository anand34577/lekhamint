name: Release

# Pushing a tag like v1.2.0 builds a signed Android APK and server binaries for every
# platform, then publishes them as a GitHub release. The APK must be signed with the
# release key: the job fails rather than publish a debug-signed build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    name: Signed APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env: { KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -PversionName="${GITHUB_REF_NAME#v}" --console=plain
      - name: Check the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$signer" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then echo "::error::APK is debug-signed"; exit 1; fi
          mkdir -p ../out && cp "$apk" "../out/LekhaMint-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: out/*.apk }

  server:
    name: Server binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }
      - name: Build the web app into the server
        working-directory: server
        run: make web
      - name: Test and cross-compile
        working-directory: server
        run: |
          go test ./... -count=1
          make release VERSION="$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with: { name: server, path: server/dist/* }

  publish:
    name: GitHub release
    needs: [android, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " { if (found) exit; found = ($2 == v) } found' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "LekhaMint $GITHUB_REF_NAME" > notes.md
      - name: Publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          (cd assets && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" assets/* --title "LekhaMint $GITHUB_REF_NAME" --notes-file notes.md
