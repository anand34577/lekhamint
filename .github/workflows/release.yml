name: Release

# Pushing a tag like v1.2.0 builds a signed Android APK, server binaries for every
# platform and a multi-arch Docker image, then publishes them as a GitHub release and
# to ghcr.io/anand34577/lekhamint. The APK must be signed with the release key: the job
# fails rather than publish a debug-signed build.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      # The receipt reader is native code (ncnn): the build needs this NDK and CMake.
      - name: Install the NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: server/go.mod, cache-dependency-path: server/go.sum }

      - name: Decode release keystore
        env: { KEYSTORE_BASE64: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and Play Store bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDirectDebugUnitTest assembleDirectRelease bundlePlayRelease -PversionName="${GITHUB_REF_NAME#v}" --console=plain

      - name: Check the APK signature
        run: |
          # The downloadable APK is the "direct" edition: no notification listener, so Play Protect lets it install.
          apk=android/app/build/outputs/apk/direct/release/app-direct-release.apk
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$signer" verify --print-certs "$apk")
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then echo "::error::APK is debug-signed"; exit 1; fi
          mkdir -p out && cp "$apk" out/LekhaMint.apk
          # The .aab is what Google Play takes (upload it in the Play Console with Play App Signing on).
          aab=android/app/build/outputs/bundle/playRelease/app-play-release.aab
          jarsigner -verify -verbose -certs "$aab" > aab-certs.txt || { cat aab-certs.txt; echo "::error::AAB signature check failed"; exit 1; }
          if grep -q "CN=Android Debug" aab-certs.txt; then echo "::error::AAB is debug-signed"; exit 1; fi
          cp "$aab" out/LekhaMint-play.aab

      - name: Build server binaries (web app embedded)
        working-directory: server
        run: |
          make web
          go test ./... -count=1
          make release VERSION="$GITHUB_REF_NAME"
          cp dist/* ../out/

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " { if (found) exit; found = ($2 == v) } found' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "LekhaMint $GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<EOF

          ### Install
          - **Server, Linux or macOS:** \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh\`
          - **Server, Windows (PowerShell):** \`irm https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.ps1 | iex\`
          - **Docker:** \`docker run -d -p 8080:8080 -v lekhamint-data:/data ghcr.io/${GITHUB_REPOSITORY}:${version}\`
          - **Android:** download \`LekhaMint.apk\` below (\`LekhaMint-play.aab\` is the Google Play upload bundle).

          Step-by-step guides are in the [wiki](https://github.com/${GITHUB_REPOSITORY}/wiki). Check downloads against \`SHA256SUMS.txt\`.
          EOF

      - name: Publish the GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" out/* --title "LekhaMint $GITHUB_REF_NAME" --notes-file notes.md

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push the Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
