name: Feature request
description: An idea that would make LekhaMint better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what gets in the way today.
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      multiple: true
      options: [Web app, Android app, Server, Installation, Docs]
