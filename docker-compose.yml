# LekhaMint with SQLite. Start:  docker compose up -d   then open http://localhost:8080
# The first account you create becomes the admin. Settings: copy .env.example to .env.
# PostgreSQL instead: docker compose -f deploy/docker-compose.postgres.yml up -d
#
# The port binds to 127.0.0.1 only by default, so sign-ins never travel the
# network in plain HTTP. To reach LekhaMint from other devices, put a TLS proxy
# in front (deploy/docker-compose.caddy.yml) or set LEKHAMINT_BIND=0.0.0.0 in
# .env when you accept plain HTTP on your LAN.

services:
  lekhamint:
    image: ghcr.io/anand34577/lekhamint:${LEKHAMINT_VERSION:-latest}
    container_name: lekhamint
    restart: unless-stopped
    ports:
      - "${LEKHAMINT_BIND:-127.0.0.1}:${LEKHAMINT_PORT:-8080}:8080"
    environment:
      LEKHAMINT_ALLOW_SIGNUP: ${LEKHAMINT_ALLOW_SIGNUP:-false}
      LEKHAMINT_TRUST_PROXY: ${LEKHAMINT_TRUST_PROXY:-false}
      LEKHAMINT_BACKUP_INTERVAL: ${LEKHAMINT_BACKUP_INTERVAL:-24h}
      LEKHAMINT_BACKUP_KEEP: ${LEKHAMINT_BACKUP_KEEP:-14}
      LEKHAMINT_LOG_LEVEL: ${LEKHAMINT_LOG_LEVEL:-info}
      # Single sign-on (Keycloak, Authentik, ...). Needs LEKHAMINT_PUBLIC_URL; see docs/13-sso-and-notifications.md
      LEKHAMINT_PUBLIC_URL: ${LEKHAMINT_PUBLIC_URL:-}
      LEKHAMINT_OIDC_ISSUER: ${LEKHAMINT_OIDC_ISSUER:-}
      LEKHAMINT_OIDC_CLIENT_ID: ${LEKHAMINT_OIDC_CLIENT_ID:-}
      LEKHAMINT_OIDC_CLIENT_SECRET: ${LEKHAMINT_OIDC_CLIENT_SECRET:-}
      LEKHAMINT_OIDC_NAME: ${LEKHAMINT_OIDC_NAME:-Single sign-on}
      LEKHAMINT_OIDC_ONLY: ${LEKHAMINT_OIDC_ONLY:-false}
      # Email and Gotify notifications
      LEKHAMINT_SMTP_HOST: ${LEKHAMINT_SMTP_HOST:-}
      LEKHAMINT_SMTP_PORT: ${LEKHAMINT_SMTP_PORT:-}
      LEKHAMINT_SMTP_USER: ${LEKHAMINT_SMTP_USER:-}
      LEKHAMINT_SMTP_PASSWORD: ${LEKHAMINT_SMTP_PASSWORD:-}
      LEKHAMINT_SMTP_FROM: ${LEKHAMINT_SMTP_FROM:-}
      LEKHAMINT_SMTP_SECURITY: ${LEKHAMINT_SMTP_SECURITY:-starttls}
      LEKHAMINT_SMTP_SKIP_VERIFY: ${LEKHAMINT_SMTP_SKIP_VERIFY:-false}
      LEKHAMINT_REMINDER_HOUR: ${LEKHAMINT_REMINDER_HOUR:-8}
      LEKHAMINT_GOTIFY_URL: ${LEKHAMINT_GOTIFY_URL:-}
      # Assistant through the server (any OpenAI-compatible API)
      LEKHAMINT_AI_BASE_URL: ${LEKHAMINT_AI_BASE_URL:-}
      LEKHAMINT_AI_API_KEY: ${LEKHAMINT_AI_API_KEY:-}
      LEKHAMINT_AI_MODEL: ${LEKHAMINT_AI_MODEL:-}
      LEKHAMINT_AI_MODELS: ${LEKHAMINT_AI_MODELS:-}
      LEKHAMINT_MAX_ATTACHMENT_MB: ${LEKHAMINT_MAX_ATTACHMENT_MB:-10}
      LEKHAMINT_MAX_LEDGER_STORAGE_MB: ${LEKHAMINT_MAX_LEDGER_STORAGE_MB:-5120}
      LEKHAMINT_HISTORY_DAYS: ${LEKHAMINT_HISTORY_DAYS:-365}
      LEKHAMINT_TRASH_DAYS: ${LEKHAMINT_TRASH_DAYS:-0}
      LEKHAMINT_FX_URL: ${LEKHAMINT_FX_URL:-https://api.frankfurter.app}
      TZ: ${TZ:-UTC}
    volumes:
      - lekhamint-data:/data
      # Keep backups on another disk too (3-2-1 rule):
      # - /mnt/backup/lekhamint:/data/backups
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

volumes:
  lekhamint-data:
